<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f6ed">
  <meta name="description" content="Um jeito simples e acolhedor de acompanhar suas questões de estudo.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Questões">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Contador de Questões</title>
</head>
<body>
  <main class="app">
    <header>
      <h1>Contador de Questões <svg class="target" viewBox="0 0 48 48" aria-hidden="true"><g fill="none" stroke="#b56047" stroke-width="3"><circle cx="22" cy="27" r="15"/><circle cx="22" cy="27" r="9"/><circle cx="22" cy="27" r="3"/></g><path d="M22 27 40 7m-7 0v8h8" fill="none" stroke="#558ba0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></h1>
      <p class="subtitle">Acompanhe seu progresso <span class="sparkles" aria-hidden="true">✦</span></p>
    </header>

    <section class="stats" aria-label="Contagem de questões">
      <div class="card total"><h2>Total</h2><p id="total">0</p></div>
      <div class="card correct"><h2><span class="badge" aria-hidden="true">✓</span> Certas</h2><p id="correct">0</p></div>
      <div class="card incorrect"><h2><span class="badge" aria-hidden="true">×</span> Erradas</h2><p id="incorrect">0</p></div>
    </section>

    <section class="actions" aria-label="Registrar e editar questões">
      <button class="primary right" id="add-correct" aria-keyshortcuts="C"><span aria-hidden="true">✓</span> Certa</button>
      <button class="primary wrong" id="add-incorrect" aria-keyshortcuts="E"><span aria-hidden="true">×</span> Errada</button>
      <button class="secondary" id="undo" aria-keyshortcuts="Control+Z Meta+Z" disabled>Desfazer <span aria-hidden="true">↶</span></button>
      <button class="secondary" id="reset" disabled>Zerar <span aria-hidden="true">↻</span></button>
    </section>

    <footer>
      <span class="stars" aria-hidden="true">✦<small>✦</small></span>
      <p id="storage-note">Seu progresso fica salvo neste aparelho.</p>
      <svg class="branch" viewBox="0 0 56 80" aria-hidden="true"><g fill="#8b9568"><path d="M29 78C30 50 26 28 19 7" fill="none" stroke="#8b9568" stroke-width="2"/><path d="M29 70Q7 67 5 47Q24 51 29 70M29 69Q49 60 51 40Q32 48 29 69M27 52Q7 45 8 29Q25 34 27 52M27 49Q43 37 42 20Q28 29 27 49M23 31Q9 18 14 2Q25 13 23 31"/></g></svg>
    </footer>
    <p class="sr-only" id="announcement" role="status" aria-live="polite" aria-atomic="true"></p>
  </main>

  <dialog id="reset-dialog" aria-labelledby="reset-title" aria-describedby="reset-description">
    <form method="dialog">
      <h2 id="reset-title">Começar de novo?</h2>
      <p id="reset-description">Isso vai zerar as questões certas e erradas deste aparelho.</p>
      <div class="dialog-actions"><button class="secondary" value="cancel" autofocus>Cancelar</button><button class="primary wrong" value="reset">Zerar contagem</button></div>
    </form>
  </dialog>
  <script src="./counter.js"></script>
  <script src="./app.js?v=2"></script>
</body>
</html>
